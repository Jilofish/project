version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: project_postgres_prod
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    env_file:
      - .env.production
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  backend:
    build:
      context: ./nodejs
    container_name: project_backend_prod
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    env_file:
      - .env.production
    environment:
      NODE_ENV: staging

  frontend:
    build:
      context: .
    container_name: project_frontend_prod
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data_prod: